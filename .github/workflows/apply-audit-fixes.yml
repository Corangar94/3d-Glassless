name: Apply audited fixes

on:
  push:
    branches:
      - agent/repair-head-coupled-3d

permissions:
  contents: write

jobs:
  audit-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-head-coupled-3d

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Apply audited source fixes
        run: python .github/scripts/apply_audit_fixes.py

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run focused regressions
        run: >-
          python -m pytest
          tests/test_bootstrap.py
          tests/test_main.py
          tests/test_overlay_process.py
          tests/test_phase0_head_coupled.py
          tests/test_reshade_install.py
          -q

      - name: Commit fixes
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/bootstrap.py tracker/main.py overlay/depth_infer.h overlay/depth_infer.cpp overlay/overlay.cpp tests/test_bootstrap.py tests/test_main.py tests/test_phase0_head_coupled.py
            git commit -m "Harden audited runtime paths"
            git push origin HEAD:agent/repair-head-coupled-3d
          } else {
            Write-Host "No audited changes required."
          }
