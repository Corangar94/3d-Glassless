name: Audit and dependency gates

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-windows-tests:
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '${{ matrix.python }}'
          cache: pip

      - name: Install project and test dependencies
        run: python -m scripts.locked_environment

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run the complete Python test suite
        run: python -m pytest -q --junitxml=release/python-tests.xml

      - name: Run deterministic software-only quality acceptance
        run: >-
          python -m scripts.software_acceptance
          --output-dir software_acceptance
          --generate-demo
          --fail-on-regression

      - name: Upload software acceptance report and demo
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glassless3d-software-acceptance-${{ matrix.python }}
          path: |
            software_acceptance
            release
          include-hidden-files: false
          if-no-files-found: error

  python-dependency-audit:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: python -m scripts.locked_environment

      - name: Audit the resolved Python environment
        run: python -m pip_audit --progress-spinner off --desc off --skip-editable

  portable-native-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build strict native policy tests
        run: |
          cmake -S overlay -B build/policies -DG3D_BUILD_OVERLAY=OFF -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror -pedantic"
          cmake --build build/policies --parallel 2
          ctest --test-dir build/policies --no-tests=error --output-on-failure
