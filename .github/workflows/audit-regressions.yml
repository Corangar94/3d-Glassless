name: Audit and dependency gates

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-windows-tests:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run the complete Python test suite
        run: python -m pytest -q

  python-dependency-audit:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -e .

      - name: Install the pinned PyPA vulnerability scanner
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit the resolved Python environment
        run: python -m pip_audit --progress-spinner off --desc off

  temporary-depth-shape-validation:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feature/full-quality-performance-overhaul'
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install CPU validation runtime
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 onnxruntime==1.20.1

      - name: Download and verify pinned depth model
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --retry-all-errors `
            --output model_fp16.onnx `
            'https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/c70d1ddbcd93c9bda8098268cc3554adf5e8dd4f/onnx/model_fp16.onnx'
          if ($LASTEXITCODE -ne 0) { throw 'model download failed' }
          $hash = (Get-FileHash model_fp16.onnx -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '2df6223f206b5164e21f664ace61dabeb9bb6a49b8b5a3e00510b4807d0f5b04') {
            throw "model digest mismatch: $hash"
          }

      - name: Validate rectangular dynamic shapes
        shell: python
        run: |
          import time
          import numpy as np
          import onnxruntime as ort

          session = ort.InferenceSession(
              'model_fp16.onnx',
              providers=['CPUExecutionProvider'],
          )
          input_meta = session.get_inputs()[0]
          output_meta = session.get_outputs()[0]
          print('G3D_MODEL_INPUT', input_meta.name, input_meta.shape, input_meta.type)
          print('G3D_MODEL_OUTPUT', output_meta.name, output_meta.shape, output_meta.type)
          for height, width in ((224, 392), (294, 518), (392, 686), (518, 518)):
              tensor = np.zeros((1, 3, height, width), dtype=np.float32)
              started = time.perf_counter()
              output = session.run(None, {input_meta.name: tensor})[0]
              elapsed_ms = (time.perf_counter() - started) * 1000.0
              print(
                  'G3D_PROFILE',
                  f'{height}x{width}',
                  'output=', output.shape,
                  f'elapsed_ms={elapsed_ms:.2f}',
              )
              assert output.shape[-2:] == (height, width)
