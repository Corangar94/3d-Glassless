name: Audit and dependency gates

on:
  pull_request:
  push:
    branches:
      - master
      - feature/full-quality-performance-overhaul
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-windows-tests:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run the complete Python test suite
        run: python -m pytest -q

  python-dependency-audit:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -e .

      - name: Install the pinned PyPA vulnerability scanner
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit the resolved Python environment
        run: python -m pip_audit --progress-spinner off --desc off

  temporary-depth-overhaul:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'feature/full-quality-performance-overhaul' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/full-quality-performance-overhaul

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Apply adaptive rectangular depth pipeline
        run: |
          python .github/scripts/apply_depth_overhaul.py
          python .github/scripts/write_depth_profile_tests.py
          python .github/scripts/fix_depth_contract_tests.py

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run focused depth and renderer regressions
        run: >-
          python -m pytest
          tests/test_depth_profiles_native.py
          tests/test_overlay_backend_shader.py
          tests/test_overlay_capture_resilience.py
          tests/test_phase0_head_coupled.py
          -q

      - name: Build the complete native runtime
        run: python scripts/bootstrap.py

      - name: Commit verified depth overhaul
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlay/depth_infer.cpp tests/test_depth_profiles_native.py tests/test_overlay_capture_resilience.py Glassless3DOverlay.exe
          if (git diff --cached --quiet) {
            throw "depth overhaul produced no source changes"
          }
          git commit -m "Add adaptive rectangular depth profiles and motion compensation"
          git push origin HEAD:feature/full-quality-performance-overhaul
