name: Audit regressions

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run focused regressions
        run: >-
          python -m pytest
          tests/test_bootstrap.py
          tests/test_bootstrap_security.py
          tests/test_main.py
          tests/test_tracker_audit.py
          tests/test_overlay_depth_guard.py
          tests/test_overlay_process.py
          tests/test_phase0_head_coupled.py
          tests/test_reshade_install.py
          -q
