name: Audit and dependency gates

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-windows-tests:
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run the complete Python test suite
        run: python -m pytest -q

      - name: Run deterministic software-only quality acceptance
        run: >-
          python -m scripts.software_acceptance
          --output-dir software_acceptance
          --generate-demo
          --fail-on-regression

      - name: Upload software acceptance report and demo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glassless3d-software-acceptance-py${{ matrix.python-version }}
          path: software_acceptance
          if-no-files-found: error

  portable-native-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and run portable native policy tests
        shell: bash
        run: |
          set -euo pipefail
          cxx="${CXX:-g++}"
          common=(-std=c++17 -O2 -Wall -Wextra -pedantic)
          "$cxx" "${common[@]}" overlay/capture_recovery.cpp overlay/capture_recovery_tests.cpp -o /tmp/capture_recovery_tests
          "$cxx" "${common[@]}" overlay/parallax_health_tests.cpp -o /tmp/parallax_health_tests
          "$cxx" "${common[@]}" overlay/pose_prediction_tests.cpp -o /tmp/pose_prediction_tests
          "$cxx" "${common[@]}" overlay/depth_result_freshness_tests.cpp -o /tmp/depth_result_freshness_tests
          "$cxx" "${common[@]}" overlay/depth_mode_policy_tests.cpp -o /tmp/depth_mode_policy_tests
          "$cxx" "${common[@]}" overlay/settings_policy_tests.cpp -o /tmp/settings_policy_tests
          "$cxx" "${common[@]}" overlay/depth_cohesion_tests.cpp -o /tmp/depth_cohesion_tests
          /tmp/capture_recovery_tests
          /tmp/parallax_health_tests
          /tmp/pose_prediction_tests
          /tmp/depth_result_freshness_tests
          /tmp/depth_mode_policy_tests
          /tmp/settings_policy_tests
          /tmp/depth_cohesion_tests

  python-dependency-audit:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -e .

      - name: Install the pinned PyPA vulnerability scanner
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit the resolved Python environment
        run: python -m pip_audit --progress-spinner off --desc off
