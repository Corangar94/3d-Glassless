name: One-time native residual pose prediction stage

on:
  push:
    branches:
      - feature/native-publish-to-render-prediction

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/native-publish-to-render-prediction

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and tests
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Apply producer-lead and native residual prediction
        run: python .github/scripts/apply_native_residual_pose_prediction.py

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run pose transport and prediction regressions
        run: >-
          python -m pytest
          tests/test_pose_filter.py
          tests/test_pose_prediction_transport.py
          tests/test_pose_filter.py
          tests/test_main.py
          tests/test_native_pose_v2.py
          tests/test_parallax_health_native.py
          -q

      - name: Build complete native runtime
        run: python scripts/bootstrap.py

      - name: Run native C++ regression tests
        shell: pwsh
        run: |
          $compiler = Get-ChildItem -LiteralPath vendor/_mingw64 -Recurse -Filter g++.exe -File |
            Select-Object -First 1
          if (-not $compiler) { throw 'verified MinGW g++.exe not found' }
          $env:PATH = "$($compiler.DirectoryName);$env:PATH"
          ctest --test-dir overlay/build_mingw --output-on-failure -C Release
          if ($LASTEXITCODE -ne 0) { throw "native CTest failed: $LASTEXITCODE" }

      - name: Commit verified native prediction path
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/pose_filter.py tracker/main.py tracker/pose_shared_memory.py overlay/overlay.cpp Glassless3DOverlay.exe
          if (git diff --cached --quiet) {
            throw "native residual prediction migration produced no runtime changes"
          }
          git commit -m "Compensate bounded publish-to-render pose latency"
          git push origin HEAD:feature/native-publish-to-render-prediction
