name: One-time tracker owner stage

on:
  push:
    branches:
      - feature/self-healing-runtime-supervisor

permissions:
  contents: write

jobs:
  apply-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/self-healing-runtime-supervisor

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and tests
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Bind tracker ownership into stopped signal
        run: python .github/scripts/fix_tracker_stopped_owner.py

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run lifecycle ownership regressions
        run: >-
          python -m pytest
          tests/test_tracker_signal_ownership.py
          tests/test_mainwindow_recovery.py
          tests/test_mainwindow_recovery_health.py
          tests/test_runtime_supervisor.py
          tests/test_tracker_process.py
          -q

      - name: Commit verified ownership binding
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/mainwindow.py
          if (git diff --cached --quiet) {
            throw "tracker owner patch produced no launcher changes"
          }
          git commit -m "Bind tracker identity into stopped lifecycle signals"
          git push origin HEAD:feature/self-healing-runtime-supervisor
