name: One-time adaptive parallax health stage

on:
  push:
    branches:
      - feature/adaptive-parallax-stability

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/adaptive-parallax-stability

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and tests
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Apply native health envelope
        run: python .github/scripts/apply_adaptive_parallax_health.py

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run focused renderer and acceptance regressions
        run: >-
          python -m pytest
          tests/test_parallax_health_native.py
          tests/test_parallax_quality.py
          tests/test_overlay_backend_shader.py
          tests/test_overlay_capture_resilience.py
          tests/test_depth_auto_telemetry.py
          -q

      - name: Run deterministic software acceptance
        run: >-
          python -m scripts.software_acceptance
          --output-dir software_acceptance
          --fail-on-regression

      - name: Build complete native runtime
        run: python scripts/bootstrap.py

      - name: Commit verified native health envelope
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlay/overlay.cpp
          if (git diff --cached --quiet) {
            throw "adaptive parallax patch produced no native source changes"
          }
          git commit -m "Fade parallax strength with tracking and depth health"
          git push origin HEAD:feature/adaptive-parallax-stability
