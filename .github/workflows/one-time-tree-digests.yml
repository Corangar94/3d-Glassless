name: One-time extracted tree digests

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  measure:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/repair-head-coupled-3d'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Download and expand pinned archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -L --fail --retry 3 --retry-all-errors --output ort.nupkg 'https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.directml/1.20.1/microsoft.ml.onnxruntime.directml.1.20.1.nupkg'
          curl.exe -L --fail --retry 3 --retry-all-errors --output dml.nupkg 'https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/1.15.2/microsoft.ai.directml.1.15.2.nupkg'
          curl.exe -L --fail --retry 3 --retry-all-errors --output mingw64.7z 'https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-18.1.8-12.0.0-msvcrt-r1/winlibs-x86_64-posix-seh-gcc-14.2.0-mingw-w64msvcrt-12.0.0-r1.7z'
          if ($LASTEXITCODE -ne 0) { throw 'archive download failed' }
          Expand-Archive -LiteralPath ort.nupkg -DestinationPath ort-package
          Expand-Archive -LiteralPath dml.nupkg -DestinationPath dml-package
          & 'C:/Program Files/7-Zip/7z.exe' x mingw64.7z '-omingw-layout' -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'MinGW extraction failed' }

      - name: Compute canonical layout digests
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import shutil
          from pathlib import Path

          def merge_tree(source: Path, destination: Path) -> None:
              if not source.is_dir():
                  return
              shutil.copytree(source, destination, dirs_exist_ok=True)

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def tree_digest(root: Path) -> tuple[str, int, int]:
              digest = hashlib.sha256()
              files = sorted(
                  (path for path in root.rglob('*') if path.is_file()),
                  key=lambda path: path.relative_to(root).as_posix(),
              )
              total = 0
              for path in files:
                  relative = path.relative_to(root).as_posix()
                  file_hash = sha256(path)
                  digest.update(relative.encode('utf-8'))
                  digest.update(b'\0')
                  digest.update(file_hash.encode('ascii'))
                  digest.update(b'\n')
                  total += path.stat().st_size
              return digest.hexdigest(), len(files), total

          layout = Path('canonical-layout')
          ort = layout / 'onnxruntime'
          dml = layout / 'directml'
          merge_tree(Path('ort-package/runtimes/win-x64/native'), ort / 'lib')
          merge_tree(Path('ort-package/build/native/include'), ort / 'include')
          merge_tree(Path('dml-package/bin/x64-win'), dml / 'lib')
          merge_tree(Path('dml-package/lib/x64-win'), dml / 'lib')
          merge_tree(Path('dml-package/include'), dml / 'include')

          for name, root in (
              ('ORT_TREE', ort),
              ('DML_TREE', dml),
              ('MINGW64_TREE', Path('mingw-layout')),
          ):
              value, count, total = tree_digest(root)
              print(
                  f'G3D_TREE {name} sha256={value} '
                  f'files={count} bytes={total} root={root}'
              )

          for path in sorted(Path('dml-package').rglob('DirectML.lib')):
              print(f'G3D_DML_LIB path={path.as_posix()} sha256={sha256(path)}')
