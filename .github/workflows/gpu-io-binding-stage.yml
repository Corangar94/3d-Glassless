name: One-time DirectML GPU I/O binding stage

on:
  push:
    branches:
      - feature/full-quality-performance-overhaul

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/full-quality-performance-overhaul

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Apply persistent DirectML I/O binding
        run: python .github/scripts/apply_gpu_io_binding.py

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run focused GPU binding and depth regressions
        run: >-
          python -m pytest
          tests/test_depth_gpu_io_binding.py
          tests/test_depth_profiles_native.py
          tests/test_fixed_depth_sessions.py
          tests/test_depth_auto_telemetry.py
          tests/test_overlay_backend_shader.py
          tests/test_overlay_capture_resilience.py
          -q

      - name: Build complete native runtime
        run: python scripts/bootstrap.py

      - name: Commit verified GPU I/O path
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlay/depth_infer.cpp overlay/depth_infer.h overlay/CMakeLists.txt overlay/overlay.cpp Glassless3DOverlay.exe
          if (git diff --cached --quiet) {
            throw "GPU I/O binding patch produced no native source changes"
          }
          git commit -m "Add persistent DirectML GPU I/O binding with safe fallback"
          git push origin HEAD:feature/full-quality-performance-overhaul
