name: Audit dependency lock workspace
on:
  push:
    branches: ['fix/audit-2026-09-06']
    paths: ['.github/workflows/audit-lock-workspace.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '${{ matrix.python }}'
      - name: Resolve full release environment from PyPI
        run: >-
          python -m pip install --dry-run --ignore-installed --only-binary=:all:
          --report resolution.json -e ".[dev]" pip-audit==2.10.1 "hatchling>=1.27" pip
      - name: Generate complete hash lock
        shell: python
        run: |
          import json, pathlib, sys
          data = json.loads(pathlib.Path('resolution.json').read_text())
          lines = ['# Resolved on Windows x64; Python ' + '.'.join(map(str, sys.version_info[:2])), '# Regenerate deliberately, review the diff, then run all release gates.', '--only-binary=:all:', '']
          for item in sorted(data['install'], key=lambda item: item['metadata']['name'].lower()):
              name, version = item['metadata']['name'], item['metadata']['version']
              if name.lower() == 'glassless3d':
                  continue
              digest = item['download_info']['archive_info']['hashes']['sha256']
              assert len(digest) == 64
              lines.append(f'{name}=={version} --hash=sha256:{digest}')
          path = pathlib.Path('windows-py' + ''.join(map(str, sys.version_info[:2])) + '.lock')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Install only verified locked wheels
        shell: pwsh
        run: |
          $lock = Get-ChildItem windows-py*.lock | Select-Object -First 1
          python -m pip install --require-hashes --only-binary=:all: -r $lock.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip inspect > resolved-environment.json
      - name: Baseline Python regression suite
        run: python -m pytest -q --junitxml=baseline-results.xml
      - name: Generate and validate small native integration model
        if: always()
        shell: pwsh
        run: |
          python -m pip install --target fixture-tools onnx==1.18.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import sys, pathlib, hashlib
          sys.path.insert(0, 'fixture-tools')
          import onnx
          from onnx import helper, TensorProto
          graph = helper.make_graph(
              [helper.make_node('ReduceMean', ['input'], ['depth'], axes=[1], keepdims=0)],
              'glassless-integration-mean',
              [helper.make_tensor_value_info('input', TensorProto.FLOAT, [1,3,'height','width'])],
              [helper.make_tensor_value_info('depth', TensorProto.FLOAT, [1,'height','width'])])
          model = helper.make_model(graph, opset_imports=[helper.make_opsetid('', 17)], ir_version=9)
          onnx.checker.check_model(model)
          data = model.SerializeToString()
          text = '#pragma once\n// Generated with onnx 1.18.0; ReduceMean channels, opset 17, IR 9.\n'
          text += '// SHA256: ' + hashlib.sha256(data).hexdigest() + '\n'
          text += 'static constexpr unsigned char kDepthTestModel[] = {' + ','.join(map(str,data)) + '};\n'
          pathlib.Path('depth_test_model.h').write_text(text, encoding='utf-8')
          '@ | python -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-lock-${{ matrix.python }}
          path: |
            windows-py*.lock
            resolution.json
            resolved-environment.json
            baseline-results.xml
            depth_test_model.h
          if-no-files-found: error
          retention-days: 3
