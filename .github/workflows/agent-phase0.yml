name: Agent phase 0 head-coupled 3D repair

on:
  push:
    branches:
      - agent/repair-head-coupled-3d

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover and apply phase 0 repairs
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import subprocess

          raw = subprocess.check_output(
              [
                  "git",
                  "show",
                  "4de779bd185af5a73e8f6f9521797c906a7dc796:.github/workflows/agent-phase0.yml",
              ],
              text=True,
              encoding="utf-8",
          )
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if start not in raw or end not in raw:
              raise RuntimeError("phase 0 patch payload markers were not found")
          body = raw.split(start, 1)[1].split(end, 1)[0]

          lines: list[str] = []
          in_triple_string = False
          for source_line in body.splitlines():
              line = source_line
              if not in_triple_string and line.startswith("          "):
                  line = line[10:]
              lines.append(line)
              if line.count("'''") % 2:
                  in_triple_string = not in_triple_string
          script = "\n".join(lines) + "\n"

          needle = (
              "if tracker.count(old_measurement) != 1:\n"
              "    raise RuntimeError(\"tracker/main.py: measurement block changed unexpectedly\")\n"
              "tracker = tracker.replace(old_measurement, new_measurement, 1)\n"
          )
          replacement = (
              "if tracker.count(old_measurement) == 1:\n"
              "    tracker = tracker.replace(old_measurement, new_measurement, 1)\n"
              "else:\n"
              "    measurement_start = tracker.index(\"                    settings = settings_reader.read()\\n\")\n"
              "    measurement_end = tracker.index(\"                    dt_s = (\\n\", measurement_start)\n"
              "    tracker = tracker[:measurement_start] + new_measurement + tracker[measurement_end:]\n"
          )
          if needle not in script:
              raise RuntimeError("tracker patch guard was not found in recovered payload")
          script = script.replace(needle, replacement, 1)

          print_needle = r'    print("\n[primary] Glassless3DOverlay.exe (D3D11 screen-capture overlay)")'
          print_replacement = r'    print("\\n[primary] Glassless3DOverlay.exe (D3D11 screen-capture overlay)")'
          if print_needle in script:
              script = script.replace(print_needle, print_replacement, 1)

          target = Path(".github/scripts/apply_phase0.py")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(script, encoding="utf-8", newline="\n")
          '@ | Set-Content -Encoding utf8 .github/recover_phase0.py
          python .github/recover_phase0.py
          python -m py_compile .github/scripts/apply_phase0.py
          python .github/scripts/apply_phase0.py
          Remove-Item -Recurse -Force .github/scripts -ErrorAction SilentlyContinue
          Remove-Item -Force .github/recover_phase0.py -ErrorAction SilentlyContinue

      - name: Use the supported MinGW-w64 overlay toolchain
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("scripts/bootstrap.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("    vswhere = _find_vswhere()\n")
          end = text.index("\n    if not use_msvc:\n", start)
          replacement = (
              "    # Prefer MinGW-w64 for the native overlay. The current WinRT COM\n"
              "    # declarations use MinGW's __CRT_UUID_DECL support and are not yet\n"
              "    # portable to MSVC without a separate compiler-compatibility pass.\n"
          )
          text = text[:start] + replacement + text[end:]

          old_cfg_error = (
              "    if cfg.returncode != 0:\n"
              "        print(\" FAILED\")\n"
              "        print(cfg.stderr[-800:])\n"
              "        return False\n"
          )
          new_cfg_error = (
              "    if cfg.returncode != 0:\n"
              "        print(\" FAILED\")\n"
              "        output = (cfg.stdout + \"\\n\" + cfg.stderr).strip()\n"
              "        print(output[-6000:])\n"
              "        return False\n"
          )
          old_build_error = (
              "    if bld.returncode != 0:\n"
              "        print(\" FAILED\")\n"
              "        print(bld.stderr[-800:])\n"
              "        return False\n"
          )
          new_build_error = (
              "    if bld.returncode != 0:\n"
              "        print(\" FAILED\")\n"
              "        output = (bld.stdout + \"\\n\" + bld.stderr).strip()\n"
              "        print(output[-12000:])\n"
              "        return False\n"
          )
          if old_cfg_error not in text or old_build_error not in text:
              raise RuntimeError("bootstrap failure-reporting blocks changed unexpectedly")
          text = text.replace(old_cfg_error, new_cfg_error, 1)
          text = text.replace(old_build_error, new_build_error, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused regression tests
        shell: bash
        run: |
          python -m pytest \
            tests/test_bootstrap.py \
            tests/test_overlay_process.py \
            tests/test_phase0_head_coupled.py -q
          python -m compileall -q launcher tracker scripts tests

      - name: Build and verify the Windows runtime
        run: python scripts/bootstrap.py

      - name: Upload verified source and binary
        uses: actions/upload-artifact@v4
        with:
          name: phase0-head-coupled-3d
          if-no-files-found: error
          path: |
            README.md
            config.yaml
            docs/HEAD_COUPLED_3D_DIRECTION.md
            launcher/calibration.py
            launcher/diagnostics.py
            launcher/mainwindow.py
            launcher/overlay_process.py
            launcher/wizard.py
            overlay/overlay.cpp
            scripts/bootstrap.py
            tracker/face_tracker.py
            tracker/face_tracker_cv2.py
            tracker/main.py
            tests/test_overlay_process.py
            tests/test_phase0_head_coupled.py
            Glassless3DOverlay.exe

      - name: Commit and push verified repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            config.yaml \
            docs/HEAD_COUPLED_3D_DIRECTION.md \
            launcher/calibration.py \
            launcher/diagnostics.py \
            launcher/mainwindow.py \
            launcher/overlay_process.py \
            launcher/wizard.py \
            overlay/overlay.cpp \
            scripts/bootstrap.py \
            tracker/face_tracker.py \
            tracker/face_tracker_cv2.py \
            tracker/main.py \
            tests/test_overlay_process.py \
            tests/test_phase0_head_coupled.py
          git add -f Glassless3DOverlay.exe
          git commit -m "Repair head-coupled 3D runtime"
          git push origin HEAD:${GITHUB_REF_NAME}
