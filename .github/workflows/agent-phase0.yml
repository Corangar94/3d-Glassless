name: Agent phase 0 head-coupled 3D repair

on:
  push:
    branches:
      - agent/repair-head-coupled-3d

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover and apply phase 0 repairs
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import urllib.request

          url = "https://raw.githubusercontent.com/Corangar94/3d-Glassless/4de779bd185af5a73e8f6f9521797c906a7dc796/.github/workflows/agent-phase0.yml"
          raw = urllib.request.urlopen(url, timeout=60).read().decode("utf-8")
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if start not in raw or end not in raw:
              raise RuntimeError("phase 0 patch payload markers were not found")
          body = raw.split(start, 1)[1].split(end, 1)[0]
          lines = [line[10:] if line.startswith("          ") else line for line in body.splitlines()]
          target = Path(".github/scripts/apply_phase0.py")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          '@ | Set-Content -Encoding utf8 .github/recover_phase0.py
          python .github/recover_phase0.py
          python -m py_compile .github/scripts/apply_phase0.py
          python .github/scripts/apply_phase0.py
          Remove-Item -Recurse -Force .github/scripts
          Remove-Item -Force .github/recover_phase0.py

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused regression tests
        shell: bash
        run: |
          python -m pytest \
            tests/test_bootstrap.py \
            tests/test_overlay_process.py \
            tests/test_phase0_head_coupled.py -q
          python -m compileall -q launcher tracker scripts tests

      - name: Build and verify the Windows runtime
        run: python scripts/bootstrap.py

      - name: Upload verified source and binary
        uses: actions/upload-artifact@v4
        with:
          name: phase0-head-coupled-3d
          if-no-files-found: error
          path: |
            README.md
            config.yaml
            docs/HEAD_COUPLED_3D_DIRECTION.md
            launcher/calibration.py
            launcher/diagnostics.py
            launcher/mainwindow.py
            launcher/overlay_process.py
            launcher/wizard.py
            overlay/overlay.cpp
            scripts/bootstrap.py
            tracker/face_tracker.py
            tracker/face_tracker_cv2.py
            tracker/main.py
            tests/test_overlay_process.py
            tests/test_phase0_head_coupled.py
            Glassless3DOverlay.exe

      - name: Commit and push verified repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            config.yaml \
            docs/HEAD_COUPLED_3D_DIRECTION.md \
            launcher/calibration.py \
            launcher/diagnostics.py \
            launcher/mainwindow.py \
            launcher/overlay_process.py \
            launcher/wizard.py \
            overlay/overlay.cpp \
            scripts/bootstrap.py \
            tracker/face_tracker.py \
            tracker/face_tracker_cv2.py \
            tracker/main.py \
            tests/test_overlay_process.py \
            tests/test_phase0_head_coupled.py
          git add -f Glassless3DOverlay.exe
          git commit -m "Repair head-coupled 3D runtime"
          git push origin HEAD:${GITHUB_REF_NAME}
