name: Agent phase 0 head-coupled 3D repair

on:
  push:
    branches:
      - agent/repair-head-coupled-3d

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply phase 0 repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8", newline="\n")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          # Native overlay: direction, real-depth gate, explicit recenter, fallback.
          overlay_path = "overlay/overlay.cpp"
          replace_once(
              overlay_path,
              "// Quit: right-click tray icon, or Ctrl+Shift+G (global hotkey)\n",
              "// Quit: right-click tray icon, or Ctrl+Shift+G (global hotkey)\n"
              "// Recenter the tracked viewing position: Ctrl+R\n",
          )
          replace_once(
              overlay_path,
              "    float2 uv_final = localUV + ApplyConfidenceProtectedParallax(d_final, hz, sw, sh, vd, eyeX, eyeY) * fade;",
              "    // Inverse texture lookup: subtract the projected screen displacement so\n"
              "    // a virtual point behind the panel follows the viewer like a real window.\n"
              "    float2 uv_final = localUV - ApplyConfidenceProtectedParallax(d_final, hz, sw, sh, vd, eyeX, eyeY) * fade;",
          )
          replace_once(
              overlay_path,
              "// When null / failed to init, the overlay falls back to a uniform 0.5 depth texture\n"
              "// so the parallax math still runs (effectively the old flat-plane behavior).\n"
              "static DepthInferencer*          g_depth       = nullptr;\n"
              "static ID3D11Texture2D*          g_fallbackTex = nullptr;  // 1x1 R16F=0.5 used when g_depth is null\n",
              "// The overlay is not shown unless real depth inference initialized. A uniform\n"
              "// far-plane texture remains available only for shader diagnostics and recovery.\n"
              "static DepthInferencer*          g_depth       = nullptr;\n"
              "static ID3D11Texture2D*          g_fallbackTex = nullptr;  // 1x1 R16F=1.0 diagnostic fallback\n",
          )
          replace_once(
              overlay_path,
              "static bool  g_wantScreenshot = false;  // Ctrl+Shift+S: save next rendered frame\n\n"
              "static const int  HOTKEY_QUIT       = 1;\n"
              "static const int  HOTKEY_DEBUG      = 2;\n"
              "static const int  HOTKEY_SCREENSHOT = 3;\n"
              "static const UINT WM_TRAYICON   = WM_USER + 1;\n"
              "static const UINT TRAY_MENU_QUIT = 1001;\n",
              "static bool  g_wantScreenshot = false;  // Ctrl+Shift+S: save next rendered frame\n"
              "static bool  g_recenterRequested = true; // first valid pose and Ctrl+R establish rest\n\n"
              "static const int  HOTKEY_QUIT       = 1;\n"
              "static const int  HOTKEY_DEBUG      = 2;\n"
              "static const int  HOTKEY_SCREENSHOT = 3;\n"
              "static const int  HOTKEY_RECENTER   = 4;\n"
              "static const UINT WM_TRAYICON       = WM_USER + 1;\n"
              "static const UINT TRAY_MENU_QUIT    = 1001;\n"
              "static const UINT TRAY_MENU_RECENTER = 1002;\n",
          )
          replace_once(
              overlay_path,
              "    if (msg == WM_HOTKEY && wp == HOTKEY_SCREENSHOT) { g_wantScreenshot = true; Log(\"WndProc: screenshot queued\"); }\n",
              "    if (msg == WM_HOTKEY && wp == HOTKEY_SCREENSHOT) { g_wantScreenshot = true; Log(\"WndProc: screenshot queued\"); }\n"
              "    if (msg == WM_HOTKEY && wp == HOTKEY_RECENTER)   { g_recenterRequested = true; Log(\"WndProc: recenter requested\"); }\n",
          )
          replace_once(
              overlay_path,
              "            HMENU menu = CreatePopupMenu();\n"
              "            AppendMenuW(menu, MF_STRING, TRAY_MENU_QUIT, L\"Quit Overlay\");\n",
              "            HMENU menu = CreatePopupMenu();\n"
              "            AppendMenuW(menu, MF_STRING, TRAY_MENU_RECENTER, L\"Recenter (Ctrl+R)\");\n"
              "            AppendMenuW(menu, MF_SEPARATOR, 0, nullptr);\n"
              "            AppendMenuW(menu, MF_STRING, TRAY_MENU_QUIT, L\"Quit Overlay\");\n",
          )
          replace_once(
              overlay_path,
              "    if (msg == WM_COMMAND && LOWORD(wp) == TRAY_MENU_QUIT) {\n"
              "        Log(\"WndProc: tray Quit\");\n"
              "        g_running = false; PostQuitMessage(0);\n"
              "    }\n",
              "    if (msg == WM_COMMAND && LOWORD(wp) == TRAY_MENU_RECENTER) {\n"
              "        g_recenterRequested = true;\n"
              "        Log(\"WndProc: tray recenter requested\");\n"
              "    }\n"
              "    if (msg == WM_COMMAND && LOWORD(wp) == TRAY_MENU_QUIT) {\n"
              "        Log(\"WndProc: tray Quit\");\n"
              "        g_running = false; PostQuitMessage(0);\n"
              "    }\n",
          )

          overlay = read(overlay_path)
          fallback_start = overlay.index("// Create a 1x1 R16_FLOAT=0.0 texture")
          fallback_end = overlay.index("// Attempt to bring up monocular depth inference", fallback_start)
          fallback_block = '''// Create a 1x1 R16_FLOAT=1.0 texture + SRV used only while the real
// depth pipeline is unavailable. The project convention is 0=near, 1=far.
static bool CreateFallbackDepthSrv() {
    // IEEE 754 half 1.0 = 0x3C00. A far plane gives deterministic motion in
    // diagnostics instead of the previous zero-depth, zero-parallax no-op.
    uint16_t farDepth = 0x3C00u;
    D3D11_TEXTURE2D_DESC td = {};
    td.Width = 1; td.Height = 1; td.MipLevels = 1; td.ArraySize = 1;
    td.Format = DXGI_FORMAT_R16_FLOAT;
    td.SampleDesc.Count = 1;
    td.Usage = D3D11_USAGE_IMMUTABLE;
    td.BindFlags = D3D11_BIND_SHADER_RESOURCE;

    D3D11_SUBRESOURCE_DATA sr = {};
    sr.pSysMem = &farDepth;
    sr.SysMemPitch = sizeof(uint16_t);

    HRESULT hr = g_dev->CreateTexture2D(&td, &sr, &g_fallbackTex);
    if (FAILED(hr)) { LogHR("CreateTexture2D(fallback depth)", hr); return false; }

    D3D11_SHADER_RESOURCE_VIEW_DESC sd = {};
    sd.Format = td.Format;
    sd.ViewDimension = D3D11_SRV_DIMENSION_TEXTURE2D;
    sd.Texture2D.MipLevels = 1;
    hr = g_dev->CreateShaderResourceView(g_fallbackTex, &sd, &g_fallbackSrv);
    if (FAILED(hr)) { LogHR("CreateShaderResourceView(fallback depth)", hr); return false; }
    Log("Fallback depth SRV created (1x1 R16F=1.0, diagnostic only)");
    return true;
}

'''
          overlay = overlay[:fallback_start] + fallback_block + overlay[fallback_end:]

          init_start = overlay.index("// Attempt to bring up monocular depth inference")
          init_end = overlay.index("static const char* CaptureStateName", init_start)
          init_block = '''// Bring up monocular depth inference. The visible effect requires a real
// depth stream; failure is reported to capture recovery instead of silently
// presenting a flat or no-op fallback.
static bool InitDepth() {
    std::wstring model = FindDepthModel();
    if (model.empty()) {
        Log("InitDepth: model file not found. Run scripts/bootstrap.py.");
        return false;
    }
    if (!g_capTex) {
        Log("InitDepth: capture texture not ready");
        return false;
    }
    D3D11_TEXTURE2D_DESC cd = {};
    g_capTex->GetDesc(&cd);

    auto* d = new DepthInferencer();
    if (!d->init(g_dev, g_ctx, model, (int)cd.Width, (int)cd.Height)) {
        Log("InitDepth: DepthInferencer::init failed: %s", d->last_error());
        delete d;
        return false;
    }
    g_depth = d;
    g_depth->set_performance_mode(g_depthMode);
    Log("InitDepth: depth inference online (capture %ux%u, model 518x518)",
        cd.Width, cd.Height);
    return true;
}

'''
          overlay = overlay[:init_start] + init_block + overlay[init_end:]
          write(overlay_path, overlay)

          replace_once(
              overlay_path,
              "    const bool visible = g_captureState == CaptureState::Running\n"
              "        && g_hasFrame\n"
              "        && (g_targetExePath.empty() || (targetForeground && captureFresh));",
              "    const bool visible = g_captureState == CaptureState::Running\n"
              "        && g_hasFrame\n"
              "        && g_depth != nullptr\n"
              "        && (g_targetExePath.empty() || (targetForeground && captureFresh));",
          )
          replace_once(
              overlay_path,
              "    InitDepth();\n"
              "    Log(\"WGC frame pool recreated in-place: %ux%u\", width, height);",
              "    if (!InitDepth()) return false;\n"
              "    Log(\"WGC frame pool recreated in-place: %ux%u\", width, height);",
          )
          replace_once(
              overlay_path,
              "    if (SUCCEEDED(hr)) {\n"
              "        InitDepth();\n"
              "        g_rebindRetry.Reset(GetTickCount64());\n"
              "        const char* boundReason = usingWgc ? \"bound_target_wgc\" : \"bound_desktop\";\n"
              "        SetCaptureState(CaptureState::Running, boundReason);\n",
              "    if (SUCCEEDED(hr)) {\n"
              "        if (!InitDepth()) {\n"
              "            DestroyCaptureResources();\n"
              "            g_bindingDirty = false;\n"
              "            g_rebindRetry.RecordFailure(GetTickCount64());\n"
              "            SetCaptureState(CaptureState::Unavailable, \"depth_unavailable\");\n"
              "            return;\n"
              "        }\n"
              "        g_rebindRetry.Reset(GetTickCount64());\n"
              "        const char* boundReason = usingWgc ? \"bound_target_wgc\" : \"bound_desktop\";\n"
              "        SetCaptureState(CaptureState::Running, boundReason);\n",
          )
          replace_once(
              overlay_path,
              "    BOOL hks = RegisterHotKey(g_hwnd, HOTKEY_SCREENSHOT, MOD_CONTROL | MOD_SHIFT, 'S');\n"
              "    Log(\"RegisterHotKey(Ctrl+Shift+S screenshot): ok=%d GLE=%lu\", hks ? 1 : 0, hks ? 0 : GetLastError());\n",
              "    BOOL hks = RegisterHotKey(g_hwnd, HOTKEY_SCREENSHOT, MOD_CONTROL | MOD_SHIFT, 'S');\n"
              "    Log(\"RegisterHotKey(Ctrl+Shift+S screenshot): ok=%d GLE=%lu\", hks ? 1 : 0, hks ? 0 : GetLastError());\n"
              "    BOOL hkr = RegisterHotKey(g_hwnd, HOTKEY_RECENTER, MOD_CONTROL, 'R');\n"
              "    Log(\"RegisterHotKey(Ctrl+R recenter): ok=%d GLE=%lu\", hkr ? 1 : 0, hkr ? 0 : GetLastError());\n",
          )
          replace_once(
              overlay_path,
              "    wcscpy_s(g_nid.szTip, L\"Glassless3D Overlay — right-click to quit\");",
              "    wcscpy_s(g_nid.szTip, L\"Glassless3D Overlay — Ctrl+R to recenter\");",
          )

          overlay = read(overlay_path)
          rest_start = overlay.index("    // Drift correction:")
          rest_end = overlay.index("    // Soft hysteretic deadzone:", rest_start)
          rest_block = '''    // Explicit rest calibration. A moving rest EMA absorbs slow deliberate
    // motion and can make the effect appear dead. The first valid pose sets rest;
    // Ctrl+R or face reacquisition requests a new rest sample.
    static float g_restX = 0.0f, g_restY = 0.0f;
    static bool  g_restValid = false;

    if (poseFresh && newPoseSample && (g_recenterRequested || !g_restValid)) {
        g_restX = hx;
        g_restY = hy;
        g_restValid = true;
        g_recenterRequested = false;
        Log("Recentered: restX=%.2f restY=%.2f", g_restX, g_restY);
    } else if (g_stateView && (!trackerStateFresh || trackerState != 1)) {
        g_restValid = false;
        g_recenterRequested = true;
    }

    // Relative displacement from the explicit rest pose.
    float dx = g_restValid ? (hx - g_restX) : 0.0f;
    float dy = g_restValid ? (hy - g_restY) : 0.0f;

'''
          overlay = overlay[:rest_start] + rest_block + overlay[rest_end:]
          write(overlay_path, overlay)

          replace_once(overlay_path, "        hx += wobble;", "        dx += wobble;")
          replace_once(
              overlay_path,
              "            hx - wobble, hy, hz, g_emaX, g_emaY, dx - wobble, dy, wobble, g_strength, g_virtualDepth,",
              "            hx, hy, hz, g_restX, g_restY, dx, dy, wobble, g_strength, g_virtualDepth,",
          )
          replace_once(
              overlay_path,
              "    UnregisterHotKey(g_hwnd, HOTKEY_SCREENSHOT);\n",
              "    UnregisterHotKey(g_hwnd, HOTKEY_SCREENSHOT);\n"
              "    UnregisterHotKey(g_hwnd, HOTKEY_RECENTER);\n",
          )

          # Launcher runtime contract: all runtime assets are mandatory.
          process_path = "launcher/overlay_process.py"
          replace_once(
              process_path,
              "OVERLAY_EXE_NAME = \"Glassless3DOverlay.exe\"\n"
              "DEPTH_MODEL_REL = os.path.join(\"models\", \"depth_anything_v2_small_fp16.onnx\")\n",
              "OVERLAY_EXE_NAME = \"Glassless3DOverlay.exe\"\n"
              "DEPTH_MODEL_RELS = (\n"
              "    os.path.join(\"models\", \"video_depth_anything_vits_518.onnx\"),\n"
              "    os.path.join(\"models\", \"depth_anything_v2_small_fp16.onnx\"),\n"
              ")\n"
              "DEPTH_MODEL_REL = DEPTH_MODEL_RELS[-1]  # backward-compatible display path\n"
              "RUNTIME_DLL_NAMES = (\"onnxruntime.dll\", \"DirectML.dll\")\n",
          )
          process = read(process_path)
          depth_start = process.index("def find_depth_model()")
          depth_end = process.index("class OverlayStartError", depth_start)
          depth_block = '''def find_depth_model() -> Optional[Path]:
    """Locate the preferred supported depth model, or return None."""
    root = _project_root()
    for relative in DEPTH_MODEL_RELS:
        candidate = root / relative
        if candidate.is_file():
            return candidate
    return None


def missing_overlay_runtime_assets(exe: Path) -> list[str]:
    """Return human-readable assets required before the overlay may start."""
    root = _project_root()
    missing: list[str] = []
    if find_depth_model() is None:
        missing.append("models/<Video Depth Anything or Depth Anything V2 ONNX model>")
    for name in RUNTIME_DLL_NAMES:
        candidates = (exe.parent / name, root / name)
        if not any(candidate.is_file() for candidate in candidates):
            missing.append(name)
    return missing


'''
          process = process[:depth_start] + depth_block + process[depth_end:]
          write(process_path, process)
          replace_once(
              process_path,
              "        Raises OverlayStartError if the binary is missing or launch fails.\n"
              "        A missing model is only a warning; the overlay has a fallback path\n"
              "        (1x1 zero depth texture) so it can still run at flat depth.\n",
              "        Raises OverlayStartError if the binary or any required runtime asset\n"
              "        is missing, or if process launch fails.\n",
          )
          process = read(process_path)
          start = process.index("        # Model absence is non-fatal")
          end = process.index("        # CWD = project root", start)
          hard_gate = '''        missing = missing_overlay_runtime_assets(exe)
        if missing:
            formatted = ", ".join(missing)
            raise OverlayStartError(
                "Glassless3D overlay runtime is incomplete. Missing: "
                f"{formatted}. Run `python scripts/bootstrap.py`, then try again."
            )

'''
          process = process[:start] + hard_gate + process[end:]
          write(process_path, process)

          # Bootstrap: build source, copy binary/DLLs, verify deployment.
          bootstrap_path = "scripts/bootstrap.py"
          bootstrap = read(bootstrap_path)
          build_start = bootstrap.index("def step_build_overlay()")
          build_end = bootstrap.index("# -- Main", build_start)
          build_block = '''def _sync_overlay_runtime_files() -> bool:
    pairs = (
        (os.path.join(ORT_DIR, "lib", "onnxruntime.dll"), os.path.join(_ROOT, "onnxruntime.dll")),
        (os.path.join(DML_DIR, "lib", "DirectML.dll"), os.path.join(_ROOT, "DirectML.dll")),
    )
    try:
        for source, destination in pairs:
            if not os.path.isfile(source):
                print(f"  FAIL  missing runtime dependency: {source}")
                return False
            shutil.copy2(source, destination)
    except OSError as exc:
        print(f"  FAIL  could not copy overlay runtime DLLs: {exc}")
        return False
    return all(os.path.isfile(destination) for _source, destination in pairs)


def step_build_overlay() -> bool:
    print("\n[primary] Glassless3DOverlay.exe (D3D11 screen-capture overlay)")

    cmake = _find_cmake()
    if not cmake:
        print("  FAIL  cmake not found.  Run:  pip install cmake")
        return False

    env = os.environ.copy()
    extra: list[str] = []
    use_msvc = False

    vswhere = _find_vswhere()
    if vswhere:
        r = subprocess.run(
            [vswhere, "-latest", "-property", "installationPath"],
            capture_output=True, text=True,
        )
        if r.returncode == 0 and r.stdout.strip():
            extra = ["-G", "Visual Studio 17 2022", "-A", "x64"]
            use_msvc = True

    if not use_msvc:
        gpp = _find_gcc()
        if not gpp:
            return False
        mingw_bin = os.path.dirname(gpp)
        env["PATH"] = mingw_bin + os.pathsep + env.get("PATH", "")
        extra = ["-G", "MinGW Makefiles"]

    build_dir = os.path.join(OVERLAY_SRC, "build_mingw" if not use_msvc else "build")
    os.makedirs(build_dir, exist_ok=True)

    print("  configuring...", end="", flush=True)
    cfg = subprocess.run(
        [cmake, OVERLAY_SRC, "-B", build_dir,
         "-DCMAKE_BUILD_TYPE=Release"] + extra,
        capture_output=True, text=True, env=env,
    )
    if cfg.returncode != 0:
        print(" FAILED")
        print(cfg.stderr[-800:])
        return False

    print(" building...", end="", flush=True)
    bld = subprocess.run(
        [cmake, "--build", build_dir, "--config", "Release"],
        capture_output=True, text=True, env=env,
    )
    if bld.returncode != 0:
        print(" FAILED")
        print(bld.stderr[-800:])
        return False

    built_candidates = (
        os.path.join(build_dir, "Release", "Glassless3DOverlay.exe"),
        os.path.join(build_dir, "Glassless3DOverlay.exe"),
    )
    built = next((path for path in built_candidates if os.path.isfile(path)), None)
    if built is None:
        print(" FAILED: built overlay executable not found")
        return False

    try:
        shutil.copy2(built, OVERLAY_OUT)
    except OSError as exc:
        print(f" FAILED: could not replace {OVERLAY_OUT}: {exc}")
        print("  Stop any running overlay process and re-run bootstrap.")
        return False

    if not _sync_overlay_runtime_files():
        return False

    required = (
        OVERLAY_OUT,
        os.path.join(_ROOT, "onnxruntime.dll"),
        os.path.join(_ROOT, "DirectML.dll"),
    )
    if not all(os.path.isfile(path) for path in required):
        print(" FAILED: overlay runtime layout is incomplete after build")
        return False

    print(f"  {os.path.getsize(OVERLAY_OUT)//1024} KB")
    print("  OK  overlay executable + ONNX Runtime + DirectML")
    return True


'''
