name: One-time native quality stage 1

on:
  push:
    branches:
      - feature/full-quality-performance-overhaul

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/full-quality-performance-overhaul

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and tests
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Apply native quality stage
        run: |
          python .github/scripts/fix_tracking_hold.py
          python .github/scripts/apply_native_quality_stage1.py
          python .github/scripts/fix_native_clamp.py

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run tracking and native contract tests
        run: >-
          python -m pytest
          tests/test_pose_filter.py
          tests/test_face_tracker.py
          tests/test_face_tracker_live.py
          tests/test_main.py
          tests/test_native_pose_v2.py
          tests/test_overlay_capture_resilience.py
          -q

      - name: Build complete native runtime
        run: python scripts/bootstrap.py

      - name: Commit verified native changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/main.py overlay/overlay.cpp
          if (git diff --cached --quiet) {
            throw "quality patch did not change expected source files"
          }
          git commit -m "Consume predicted pose telemetry and improve sampling"
          git push origin HEAD:feature/full-quality-performance-overhaul
