name: One-time software replay quality stage

on:
  push:
    branches:
      - feature/software-replay-quality-gate

permissions:
  contents: write

jobs:
  apply-test-report:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/software-replay-quality-gate

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and tests
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Apply replay-validated defaults and docs
        run: python .github/scripts/apply_software_replay_defaults.py

      - name: Compile Python sources
        run: python -m compileall -q launcher tracker scripts tests

      - name: Run replay and synthetic parallax tests
        run: >-
          python -m pytest
          tests/test_pose_filter.py
          tests/test_replay_quality.py
          tests/test_parallax_quality.py
          tests/test_main.py
          tests/test_wizard.py
          -q

      - name: Run software-only acceptance
        run: >-
          python -m scripts.software_acceptance
          --output-dir software_acceptance
          --generate-demo
          --fail-on-regression

      - name: Upload acceptance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replay-quality-stage
          path: software_acceptance
          if-no-files-found: error

      - name: Commit verified software quality gate
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/replay_quality.py tracker/main.py launcher/wizard.py README.md docs/ROADMAP.md
          if (git diff --cached --quiet) {
            throw "software replay migration produced no source changes"
          }
          git commit -m "Adopt replay-validated tracking defaults and software acceptance"
          git push origin HEAD:feature/software-replay-quality-gate
