camera:
  fps: 30
  height: 720
  index: 0
  width: 1280
  latest_frame:
    enabled: true
    wait_timeout_ms: 1000
    max_frame_age_ms: 250
    freeze_check_interval_ms: 250
    freeze_timeout_ms: 3000
    failure_backoff_ms: 20
    shutdown_timeout_ms: 1000
  reconnect:
    immediate_retries: 1
    max_failures: 8
    base_delay_s: 0.5
    max_delay_s: 8.0
    max_outage_s: 45.0
    heartbeat_s: 1.0
overlay:
  depth_curve: 2
  depth_gamma: 2.0
  depth_performance_mode: auto
  focus_radius: 0.1
  screen_h_cm: 0.0
  screen_w_cm: 0.0
  strength_x: 1.0
  strength_y: 0.4
  virtual_depth_cm: 30.0
recovery:
  immediate_retries: 1
  base_delay_s: 1.0
  max_delay_s: 20.0
  max_failures: 5
  failure_window_s: 90.0
  cooldown_s: 60.0
  stable_reset_s: 30.0
screen:
  height_cm: 33.6
  width_cm: 119.3
shared_memory:
  name: G3D
tracking:
  auto_tune: true
  tracker_backend: auto
  backend_failover:
    retry_primary_after_ms: 30000
    max_primary_retries: 1
    shadow_probe_interval_ms: 100
    shadow_probe_timeout_ms: 5000
    minimum_healthy_callbacks: 3
  mediapipe_runtime:
    stall_timeout_ms: 5000
    max_consecutive_errors: 3
    max_backlog_ms: 150
    max_result_age_ms: 250
    max_consecutive_stale_results: 3
    stale_result_window_ms: 1000
    max_input_width_px: 960
  camera_fov_deg: 90.0
  camera_tilt_deg: -17.92
  hold_ms: 500
  ipd_cm: 6.3
  pose_step_limit:
    max_xy_speed_cm_s: 300.0
    max_z_speed_cm_s: 360.0
    reset_after_ms: 500
  smoothing_q: 2.0
  smoothing_r: 0.1
  prediction_horizon_ms: 0.0
  max_prediction_ms: 80.0
